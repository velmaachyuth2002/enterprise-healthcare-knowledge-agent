[project]
name = "enterprise-healthcare-knowledge-agent"
version = "0.1.0"
description = "Enterprise Healthcare Knowledge Agent"
authors = [
    { name = "Achyuth Velma", email = "achyuthr37@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.141.1",
    "groq>=1.6.0",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.0",
    "sentence-transformers>=5.7.0",
    "sqlalchemy>=2.0.51",
    "torch>=2.13.0",
    "uvicorn[standard]>=0.52.1",
]

# Application, not a published library — no build backend needed, just an
# environment. Lets us use a flat `app/` package instead of `src/<name>/`.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "aiosmtpd>=1.4.6",
    "httpx2>=2.9.1",
    "langchain-community<0.4",
    "langchain-openai>=1.5.1",
    "pytest>=9.1.1",
    "ragas>=0.4.3",
]

# torch is a transitive dependency (via sentence-transformers) used only
# for running a small embedding model on CPU - nothing here has a GPU.
# Without this, resolving on Linux (as the Docker image does) pulls the
# CUDA-enabled build, which is multiple gigabytes of unused libraries.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
