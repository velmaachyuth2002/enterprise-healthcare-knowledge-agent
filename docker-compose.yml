services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Overrides whatever's in .env: inside the compose network, the SMTP
      # catcher is reached by service name, not localhost.
      SMTP_HOST: smtp
      SMTP_PORT: "1025"
      # Points SQLite at the mounted volume below instead of the plain
      # local-dev default (sqlite:///./dev.db, inside the container's
      # disposable filesystem) - four slashes because this is an absolute
      # path, not a relative one.
      DATABASE_URL: "sqlite:////app/data/dev.db"
    volumes:
      # Named volume, not a mount of /app itself - mounting /app would
      # hide the application code COPYed in at build time. Survives
      # `docker compose down`; only `docker compose down -v` removes it.
      - db_data:/app/data
    depends_on:
      - smtp

  # Real SMTP receiving plus a web UI to see received mail - nicer for a
  # docker-compose demo than tailing container logs. Only the web UI is
  # published to the host; the app reaches SMTP directly over the
  # compose network.
  smtp:
    image: axllent/mailpit
    ports:
      - "8025:8025"

volumes:
  db_data:
